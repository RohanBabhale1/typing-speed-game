services:

  db:
    image: postgres:16-alpine
    container_name: typing-speed-db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    
    init: true

    container_name: typing-speed-backend

    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      PORT: ${BACKEND_PORT}
      FRONTEND_URL: ${FRONTEND_URL}

    ports:
      - "4000:4000"

    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma

    depends_on:
      db:
        condition: service_healthy

    command:
      [
        "sh",
        "-c",
        "bunx prisma migrate deploy && bun run dev"
      ]


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    
    init: true

    container_name: typing-speed-frontend

    environment:
      VITE_GRAPHQL_URL: http://localhost:4000/graphql
      VITE_LAN_URL: http://10.0.9.231:5173

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

    command: ["npm", "run", "dev", "--", "--host"]


volumes:
  postgres_data: